server:
  port: ${ALFIO_BRIDGE_PORT:8089}

spring:
  application:
    name: alfio-bridge
  datasource:
    url: jdbc:postgresql://${ALFIO_DB_HOST:localhost}:${ALFIO_DB_PORT:5432}/${ALFIO_DB_NAME:alfio}
    username: ${ALFIO_DB_USER:alfio}
    password: ${ALFIO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ALFIO_DB_MAX_POOL_SIZE:4}
      minimum-idle: ${ALFIO_DB_MIN_IDLE:1}
      read-only: true
      pool-name: alfio-bridge-pool
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

alfio:
  bridge:
    security:
      api-key: ${ALFIO_BRIDGE_API_KEY:change-me}

logging:
  level:
    com.alphnology.alfiobridge: INFO
