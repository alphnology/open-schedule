services:
  traefik:
    image: traefik:v3.6.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.network=alphnology-traefik"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=info@alphnology.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - alphnology-traefik

  db-open-schedule:
    image: postgres:18.1
    container_name: open-schedule-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open-schedule
    volumes:
      - ./data_open_schedule/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d open-schedule" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - alphnology-traefik

  app-open-schedule:
    image: alphnology/open-schedule:latest
    container_name: open-schedule-app
    restart: unless-stopped
    environment:
      DB_HOST: db-open-schedule
      DB_PORT: 5432
      DB_PASSWORD: postgres
      DB_NAME: open-schedule
      EVENT_WEBSITE: https://alphnology.com
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: https://files.alphnology.org
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: open-schedule
      EVENT_SCHEDULE: https://schedule.alphnology.org/
      GIT_HUB_API_TOKEN: github_pat_xxx
      GIT_HUB_REPOSITORY_NAME: alphnology/open-schedule
      APP_LOGO_PATH: /assets/logo.png
      #BRANDING_EXTERNAL_CSS_PATH: /assets/branding-overrides.css
    volumes:
      - ./assets:/assets
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openschedule.rule=Host(`schedule.alphnology.org`)"
      - "traefik.http.routers.openschedule.entrypoints=websecure"
      - "traefik.http.routers.openschedule.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openschedule.service=openschedule-service"
      - "traefik.http.services.openschedule-service.loadbalancer.server.port=51675"
      - "traefik.http.routers.openschedule.tls=true"
    depends_on:
      db-open-schedule:
        condition: service_healthy
    networks:
      - alphnology-traefik

  alfio-bridge:
    image: alphnology/alfio-bridge:latest
    container_name: alfio-bridge
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.35"
    pids_limit: 200
    environment:
      ALFIO_BRIDGE_PORT: 8080
      ALFIO_BRIDGE_API_KEY: change-me
      ALFIO_DB_HOST: db-alfio
      ALFIO_DB_PORT: 5432
      ALFIO_DB_NAME: alfio
      ALFIO_DB_USER: alfio
      ALFIO_DB_PASSWORD: change-me
      ALFIO_DB_MAX_POOL_SIZE: 4
      ALFIO_DB_MIN_IDLE: 1
    expose:
      - "8080"
    networks:
      - alphnology-traefik

  minio:
    image: minio/minio:latest
    container_name: open-schedule-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openschedule-files.rule=Host(`files.alphnology.org`)"
      - "traefik.http.routers.openschedule-files.entrypoints=websecure"
      - "traefik.http.routers.openschedule-files.tls=true"
      - "traefik.http.routers.openschedule-files.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openschedule-files.service=openschedule-files-service"
      - "traefik.http.services.openschedule-files-service.loadbalancer.server.port=9000"
    volumes:
      - ./data_open_schedule/minio:/data
    networks:
      - alphnology-traefik

networks:
  alphnology-traefik:
    external: true
